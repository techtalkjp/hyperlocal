#:schema node_modules/wrangler/config-schema.json
name = "hyperlocal-web"
account_id = "91ff95bcb91fbfa1b1c5c356262b1fe4"

main = "./workers/app.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2026-09-14"

assets = { directory = "./build/client", binding = "ASSETS", html_handling = "drop-trailing-slash" }

routes = [{ pattern = "tokyo.hyper-local.app", custom_domain = true }]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "hyperlocal"
database_id = "3af44920-5ced-4dde-9d22-18f3e20eada3"

[cache]
enabled = true
