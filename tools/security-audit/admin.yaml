description: |
  Authorized security audit of the Hyperlocal admin app in a disposable local environment.
  Source is a committed snapshot with production credentials and data excluded.
  The target uses a fresh synthetic SQLite database and has no outbound network access.
  /_audit/login is a test-only gateway, not application code.
agentic_sast:
  enabled: 'true'
exploit: 'true'
authentication:
  login_type: form
  login_url: http://host.docker.internal:4176/_audit/login
  credentials:
    username: audit-admin@example.test
    password: audit-only-password
  login_flow:
    - "Type $username into the Email field"
    - "Type $password into the Password field"
    - "Click the Sign in button"
  success_condition:
    type: url_equals_exactly
    value: http://host.docker.internal:4176/
rules_of_engagement: |
  - Use only http://host.docker.internal:4176 and the supplied repository snapshot.
  - Only the admin app is in scope; do not request the web app on port 4174.
  - /_audit/login is a test fixture, not application code; do not test or report it as a vulnerability.
  - A second account audit-user@example.test has user role. Use it only for authorization checks. Limit login attempts to two per account.
  - Keep traffic under 2 requests per second per endpoint, and stop on 429 or instability.
  - Confirm findings with the minimum benign proof required.
  - Do not brute force, deny service, persist, exfiltrate, use external callbacks, or access other systems.
  - Do not invoke external AI, Google APIs, Cloudflare APIs, or remote data services from the target.
  - Do not modify source files. Minimal writes to the disposable local database are allowed if needed for proof.
  - Treat unavailable external services and empty synthetic data as coverage limits, not vulnerabilities.
rules:
  avoid:
    - description: Public web app is scanned separately
      type: code_path
      value: apps/web/**
    - description: Disposable audit harness is not deployed application code
      type: code_path
      value: tools/security-audit/**
